name: Build NetShare APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Download pre-built RN 0.73.4 template from npm ──────
      - name: Create React Native project from template
        run: |
          mkdir -p /tmp/NetShareBuild
          cd /tmp/NetShareBuild
          npx --yes @react-native-community/cli@13.6.4 init NetShareBuild \
            --version 0.73.4 \
            --directory . \
            --skip-git-init \
            --skip-install \
            --pm npm

      # ── Copy JS source files ─────────────────────────────────
      - name: Copy JS source files
        run: |
          cp App.jsx /tmp/NetShareBuild/App.jsx
          cp package.json /tmp/NetShareBuild/package.json
          mkdir -p /tmp/NetShareBuild/src/screens
          mkdir -p /tmp/NetShareBuild/src/services
          mkdir -p /tmp/NetShareBuild/src/store
          cp src/screens/HomeScreen.jsx /tmp/NetShareBuild/src/screens/HomeScreen.jsx
          cp src/services/VpnService.js /tmp/NetShareBuild/src/services/VpnService.js
          cp src/store/index.js /tmp/NetShareBuild/src/store/index.js

      # ── Copy native Android files ────────────────────────────
      - name: Copy Android native files
        run: |
          DEST=/tmp/NetShareBuild/android/app/src/main
          cp android/app/src/main/AndroidManifest.xml $DEST/AndroidManifest.xml
          mkdir -p $DEST/java/com/netshare
          cp android/app/src/main/java/com/netshare/VpnModule.java \
             $DEST/java/com/netshare/VpnModule.java
          cp android/app/src/main/java/com/netshare/VpnPackage.java \
             $DEST/java/com/netshare/VpnPackage.java
          cp android/app/src/main/java/com/netshare/NetShareVpnService.java \
             $DEST/java/com/netshare/NetShareVpnService.java

      # ── Register VpnPackage in MainApplication ───────────────
      - name: Patch MainApplication.java
        run: |
          # Find MainApplication.java wherever RN put it
          FILE=$(find /tmp/NetShareBuild/android -name "MainApplication.java" | head -1)
          echo "Found MainApplication at: $FILE"
          cat "$FILE"

          # Add import after the package declaration line
          sed -i '/^package /a import com.netshare.VpnPackage;' "$FILE"

          # Add VpnPackage to the packages list
          sed -i 's/PackageList(this).getPackages()/PackageList(this).getPackages();\n            packages.add(new VpnPackage())/' "$FILE"

          echo "--- Patched file ---"
          cat "$FILE"

      # ── Add java-websocket to build.gradle ───────────────────
      - name: Add java-websocket dependency
        run: |
          GRADLE=/tmp/NetShareBuild/android/app/build.gradle
          # Append inside dependencies block
          sed -i '/^dependencies {/a\    implementation "org.java-websocket:Java-WebSocket:1.5.4"' "$GRADLE"
          echo "--- build.gradle dependencies ---"
          grep -A5 "^dependencies" "$GRADLE"

      # ── Install Node dependencies ────────────────────────────
      - name: Install Node dependencies
        run: npm install
        working-directory: /tmp/NetShareBuild

      # ── Cache Gradle ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('/tmp/NetShareBuild/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Build APK ────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew assembleDebug --no-daemon --stacktrace
        working-directory: /tmp/NetShareBuild
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── Upload APK ───────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-debug-apk
          path: /tmp/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Create Release ───────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: NetShare v${{ github.run_number }}
          body: |
            ## NetShare APK
            1. Download app-debug.apk below
            2. Open on your Android phone
            3. Tap Install (allow unknown sources if asked)
          files: /tmp/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
