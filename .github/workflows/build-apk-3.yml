name: Build NetShare APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Initialize React Native project ──────────────────────
      - name: Initialize React Native project
        run: |
          cd $HOME
          npx --yes react-native@0.73.4 init NetShareBuild --version 0.73.4 --skip-install
          echo "=== RN init complete. Listing $HOME/NetShareBuild ==="
          ls -la $HOME/NetShareBuild/
          echo "=== Android folder ==="
          ls -la $HOME/NetShareBuild/android/ || echo "NO ANDROID FOLDER"
        env:
          CI: false

      # ── Copy JS source files ─────────────────────────────────
      - name: Copy JS source files
        run: |
          DEST=$HOME/NetShareBuild
          cp $GITHUB_WORKSPACE/App.jsx $DEST/App.jsx
          cp $GITHUB_WORKSPACE/package.json $DEST/package.json
          mkdir -p $DEST/src/screens $DEST/src/services $DEST/src/store
          cp $GITHUB_WORKSPACE/src/screens/HomeScreen.jsx $DEST/src/screens/
          cp $GITHUB_WORKSPACE/src/services/VpnService.js  $DEST/src/services/
          cp $GITHUB_WORKSPACE/src/store/index.js           $DEST/src/store/

      # ── Copy native Android files ────────────────────────────
      - name: Copy Android native files
        run: |
          SRC=$GITHUB_WORKSPACE/android/app/src/main
          DEST=$HOME/NetShareBuild/android/app/src/main
          cp $SRC/AndroidManifest.xml $DEST/AndroidManifest.xml
          mkdir -p $DEST/java/com/netshare
          cp $SRC/java/com/netshare/VpnModule.java          $DEST/java/com/netshare/
          cp $SRC/java/com/netshare/VpnPackage.java         $DEST/java/com/netshare/
          cp $SRC/java/com/netshare/NetShareVpnService.java $DEST/java/com/netshare/

      # ── Patch MainApplication to register VpnPackage ────────
      - name: Patch MainApplication.java
        run: |
          echo "=== Searching for MainApplication.java ==="
          find $HOME/NetShareBuild -name "MainApplication.java" 2>/dev/null
          FILE=$(find $HOME/NetShareBuild -name "MainApplication.java" 2>/dev/null | head -1)
          
          if [ -z "$FILE" ]; then
            echo "ERROR: MainApplication.java not found!"
            find $HOME/NetShareBuild/android -type f | sort
            exit 1
          fi
          
          echo "Found: $FILE"
          echo "=== Original content ==="
          cat "$FILE"
          
          # Add VpnPackage import after package declaration
          sed -i '/^package /a import com.netshare.VpnPackage;' "$FILE"
          
          # Add VpnPackage to packages list
          sed -i 's/List<ReactPackage> packages = new PackageList(this).getPackages();/List<ReactPackage> packages = new PackageList(this).getPackages();\n      packages.add(new VpnPackage());/' "$FILE"
          
          echo "=== Patched content ==="
          cat "$FILE"

      # ── Add java-websocket to build.gradle ───────────────────
      - name: Add java-websocket dependency
        run: |
          GRADLE=$HOME/NetShareBuild/android/app/build.gradle
          echo "=== Current build.gradle ==="
          cat "$GRADLE"
          sed -i '/^dependencies {/a\    implementation "org.java-websocket:Java-WebSocket:1.5.4"' "$GRADLE"
          echo "=== Patched build.gradle ==="
          grep -A3 "java-websocket" "$GRADLE"

      # ── Install Node dependencies ────────────────────────────
      - name: Install Node dependencies
        run: npm install
        working-directory: ${{ env.HOME }}/NetShareBuild

      # ── Cache Gradle ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Build APK ────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100
        working-directory: ${{ env.HOME }}/NetShareBuild
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── Upload APK artifact ───────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-debug-apk
          path: ${{ env.HOME }}/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Create GitHub Release ────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: NetShare v${{ github.run_number }}
          body: |
            ## NetShare APK
            1. Download app-debug.apk below
            2. Open on your Android phone
            3. Tap Install (allow unknown sources if asked)
          files: ${{ env.HOME }}/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
