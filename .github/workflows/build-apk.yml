name: Build NetShare APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Initialize a fresh React Native project ──────────────
      - name: Initialize React Native project
        run: |
          npm install -g react-native@0.73.4
          npx react-native init NetShareBuild --version 0.73.4 --skip-install
        working-directory: /tmp

      # ── Copy our source files into the RN project ────────────
      - name: Copy source files
        run: |
          cp -r src/ /tmp/NetShareBuild/src/
          cp App.jsx /tmp/NetShareBuild/App.jsx
          cp package.json /tmp/NetShareBuild/package.json
          cp android/app/src/main/AndroidManifest.xml \
             /tmp/NetShareBuild/android/app/src/main/AndroidManifest.xml
          mkdir -p /tmp/NetShareBuild/android/app/src/main/java/com/netshare
          cp android/app/src/main/java/com/netshare/*.java \
             /tmp/NetShareBuild/android/app/src/main/java/com/netshare/

      # ── Register VpnPackage in MainApplication ───────────────
      - name: Patch MainApplication.java
        run: |
          FILE=$(find /tmp/NetShareBuild/android -name "MainApplication.java")
          sed -i 's/import com.facebook.react.ReactApplication;/import com.facebook.react.ReactApplication;\nimport com.netshare.VpnPackage;/' "$FILE"
          sed -i 's/packages.add(new MainReactPackage());/packages.add(new MainReactPackage());\n                packages.add(new VpnPackage());/' "$FILE"

      # ── Add java-websocket dependency ────────────────────────
      - name: Add java-websocket to build.gradle
        run: |
          echo "" >> /tmp/NetShareBuild/android/app/build.gradle
          echo "dependencies { implementation 'org.java-websocket:Java-WebSocket:1.5.4' }" \
            >> /tmp/NetShareBuild/android/app/build.gradle

      # ── Install dependencies ─────────────────────────────────
      - name: Install Node dependencies
        run: npm install
        working-directory: /tmp/NetShareBuild

      # ── Cache Gradle ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('/tmp/NetShareBuild/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Build APK ────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew assembleDebug --no-daemon
        working-directory: /tmp/NetShareBuild
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── Upload APK ───────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-debug-apk
          path: /tmp/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Create Release ───────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: NetShare v${{ github.run_number }}
          body: |
            ## NetShare APK
            1. Download app-debug.apk below
            2. Open on your Android phone
            3. Tap Install (allow unknown sources if asked)
          files: /tmp/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
