name: Build NetShare APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: /home/runner/NetShareBuild

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Initialize React Native scaffold ─────────────────────
      - name: Initialize React Native project
        run: |
          cd /home/runner
          npx --yes react-native@0.73.4 init NetShareBuild --version 0.73.4 --skip-install
        env:
          CI: false

      # ── Copy JS source files ─────────────────────────────────
      - name: Copy JS source files
        run: |
          cp $GITHUB_WORKSPACE/App.jsx $BUILD_DIR/App.jsx
          # Use scaffold's package.json but merge key deps to avoid broken native linking
          mkdir -p $BUILD_DIR/src/screens $BUILD_DIR/src/services $BUILD_DIR/src/store
          cp $GITHUB_WORKSPACE/src/screens/HomeScreen.jsx $BUILD_DIR/src/screens/
          cp $GITHUB_WORKSPACE/src/services/VpnService.js  $BUILD_DIR/src/services/
          cp $GITHUB_WORKSPACE/src/store/index.js          $BUILD_DIR/src/store/

      # ── Copy & fix AndroidManifest ───────────────────────────
      # BUG FIX: Use env vars instead of shell vars inside Python heredoc.
      # Single-quoted heredocs ('PYEOF') prevent shell variable expansion,
      # so $GITHUB_WORKSPACE was passed as a literal string → FileNotFoundError.
      - name: Copy and fix AndroidManifest
        env:
          MANIFEST_SRC: ${{ github.workspace }}/android/app/src/main/AndroidManifest.xml
          MANIFEST_DEST: /home/runner/NetShareBuild/android/app/src/main/AndroidManifest.xml
        run: |
          python3 - << 'PYEOF'
          import re, os

          src  = os.environ["MANIFEST_SRC"]
          dest = os.environ["MANIFEST_DEST"]

          with open(src, "r") as f:
              content = f.read()

          # Fix package name
          content = content.replace('package="com.netshare"', 'package="com.netsharebuild"')
          # Fix service reference (relative .NetShareVpnService -> full class)
          content = content.replace(
              'android:name=".NetShareVpnService"',
              'android:name="com.netsharebuild.netshare.NetShareVpnService"'
          )
          # Fix any other com.netshare references (but not com.netsharebuild)
          content = re.sub(r'(?<!\.)com\.netshare(?!build)', 'com.netsharebuild', content)

          # BUG FIX: Add required permission for foregroundServiceType="connectedDevice"
          # on Android 14+ (API 34). Missing this causes a crash at runtime.
          if 'FOREGROUND_SERVICE_CONNECTED_DEVICE' not in content:
              content = content.replace(
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />'
              )

          with open(dest, "w") as f:
              f.write(content)

          print("AndroidManifest fixed")
          for line in content.splitlines():
              if "package" in line or "NetShare" in line or "FOREGROUND" in line:
                  print(line.strip())
          PYEOF

      # ── Write Java native files (pre-fixed, no sed) ──────────
      - name: Write Java native files
        run: |
          DEST=$BUILD_DIR/android/app/src/main/java/com/netsharebuild/netshare
          mkdir -p $DEST

          # ── VpnPackage.java ──────────────────────────────────
          cat > $DEST/VpnPackage.java << 'JAVAEOF'
          package com.netsharebuild.netshare;
          import com.facebook.react.ReactPackage;
          import com.facebook.react.bridge.NativeModule;
          import com.facebook.react.bridge.ReactApplicationContext;
          import com.facebook.react.uimanager.ViewManager;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          public class VpnPackage implements ReactPackage {
              @Override
              public List<NativeModule> createNativeModules(ReactApplicationContext reactContext) {
                  List<NativeModule> modules = new ArrayList<>();
                  modules.add(new VpnModule(reactContext));
                  return modules;
              }
              @Override
              public List<ViewManager> createViewManagers(ReactApplicationContext reactContext) {
                  return Collections.emptyList();
              }
          }
          JAVAEOF

          # ── VpnModule.java ───────────────────────────────────
          cat > $DEST/VpnModule.java << 'JAVAEOF'
          package com.netsharebuild.netshare;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;
          import androidx.annotation.NonNull;
          import com.facebook.react.bridge.ActivityEventListener;
          import com.facebook.react.bridge.Promise;
          import com.facebook.react.bridge.ReactApplicationContext;
          import com.facebook.react.bridge.ReactContextBaseJavaModule;
          import com.facebook.react.bridge.ReactMethod;
          import com.facebook.react.modules.core.DeviceEventManagerModule;
          public class VpnModule extends ReactContextBaseJavaModule implements ActivityEventListener {
              private static final int VPN_REQUEST_CODE = 0x0F;
              private Promise vpnPermissionPromise;
              private static ReactApplicationContext reactContext;
              public VpnModule(ReactApplicationContext context) {
                  super(context);
                  reactContext = context;
                  context.addActivityEventListener(this);
              }
              @NonNull @Override
              public String getName() { return "VpnModule"; }
              @ReactMethod
              public void prepare(Promise promise) {
                  try {
                      Activity activity = getCurrentActivity();
                      if (activity == null) { promise.reject("NO_ACTIVITY", "No activity"); return; }
                      Intent intent = VpnService.prepare(activity);
                      if (intent != null) { vpnPermissionPromise = promise; activity.startActivityForResult(intent, VPN_REQUEST_CODE); }
                      else { promise.resolve(true); }
                  } catch (Exception e) { promise.reject("VPN_PREPARE_ERROR", e.getMessage()); }
              }
              @ReactMethod
              public void startVpn(String relayUrl, String sessionCode, String role, Promise promise) {
                  try {
                      Activity activity = getCurrentActivity();
                      if (activity == null) { promise.reject("NO_ACTIVITY", "No activity"); return; }
                      Intent i = new Intent(activity, NetShareVpnService.class);
                      i.putExtra("RELAY_URL", relayUrl);
                      i.putExtra("SESSION_CODE", sessionCode);
                      i.putExtra("ROLE", role);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) activity.startForegroundService(i);
                      else activity.startService(i);
                      promise.resolve(true);
                  } catch (Exception e) { promise.reject("VPN_START_ERROR", e.getMessage()); }
              }
              @ReactMethod
              public void stopVpn(Promise promise) {
                  try {
                      Activity activity = getCurrentActivity();
                      if (activity == null) { promise.reject("NO_ACTIVITY", "No activity"); return; }
                      Intent i = new Intent(activity, NetShareVpnService.class);
                      i.setAction("STOP_VPN");
                      activity.startService(i);
                      promise.resolve(true);
                  } catch (Exception e) { promise.reject("VPN_STOP_ERROR", e.getMessage()); }
              }
              public static void emitEvent(String eventName, String data) {
                  if (reactContext != null)
                      reactContext.getJSModule(DeviceEventManagerModule.RCTDeviceEventEmitter.class).emit(eventName, data);
              }
              @Override
              public void onActivityResult(Activity activity, int requestCode, int resultCode, Intent data) {
                  if (requestCode == VPN_REQUEST_CODE && vpnPermissionPromise != null) {
                      vpnPermissionPromise.resolve(resultCode == Activity.RESULT_OK);
                      vpnPermissionPromise = null;
                  }
              }
              @Override public void onNewIntent(Intent intent) {}
          }
          JAVAEOF

          # ── NetShareVpnService.java ──────────────────────────
          cat > $DEST/NetShareVpnService.java << 'JAVAEOF'
          package com.netsharebuild.netshare;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;
          import org.java_websocket.client.WebSocketClient;
          import org.java_websocket.handshake.ServerHandshake;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.net.InetAddress;
          import java.net.Socket;
          import java.net.URI;
          import java.nio.ByteBuffer;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import javax.net.ssl.SSLSocketFactory;
          public class NetShareVpnService extends VpnService {
              private static final String TAG = "NetShareVPN";
              private static final String CHANNEL_ID = "netshare_vpn";
              private static final int NOTIFICATION_ID = 1;
              private ParcelFileDescriptor vpnInterface;
              private WebSocketClient wsClient;
              private ExecutorService executor;
              private volatile boolean isRunning = false;
              private String relayUrl, sessionCode, role;
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP_VPN".equals(intent.getAction())) {
                      stopVpnTunnel(); return START_NOT_STICKY;
                  }
                  relayUrl = intent.getStringExtra("RELAY_URL");
                  sessionCode = intent.getStringExtra("SESSION_CODE");
                  role = intent.getStringExtra("ROLE");
                  startForegroundNotification();
                  executor = Executors.newFixedThreadPool(3);
                  executor.execute(this::startVpnTunnel);
                  return START_STICKY;
              }
              private void startVpnTunnel() {
                  try {
                      vpnInterface = new Builder()
                          .setSession("NetShare")
                          .addAddress("10.8.0.2", 24)
                          .addRoute("0.0.0.0", 0)
                          .addDnsServer("8.8.8.8")
                          .addDnsServer("8.8.4.4")
                          .setMtu(1500)
                          .addDisallowedApplication(getPackageName())
                          .establish();
                      if (vpnInterface == null) { VpnModule.emitEvent("vpnError", "Failed to establish VPN"); return; }
                      isRunning = true;
                      VpnModule.emitEvent("vpnConnected", sessionCode);
                      connectToRelay();
                  } catch (Exception e) { VpnModule.emitEvent("vpnError", e.getMessage()); }
              }
              private void connectToRelay() throws Exception {
                  URI uri = new URI(relayUrl);
                  final NetShareVpnService self = this;
                  wsClient = new WebSocketClient(uri) {
                      @Override public void onOpen(ServerHandshake h) {
                          if ("host".equals(role)) send("{\"type\":\"HOST_REGISTER\",\"netType\":\"WiFi\"}");
                          else send("{\"type\":\"CLIENT_JOIN\",\"code\":\"" + sessionCode + "\"}");
                      }
                      @Override public void onMessage(String msg) { handleRelayMessage(msg); }
                      @Override public void onMessage(ByteBuffer bytes) {
                          if (vpnInterface != null && isRunning) {
                              try { new FileOutputStream(vpnInterface.getFileDescriptor()).write(bytes.array(), bytes.position(), bytes.remaining()); }
                              catch (Exception e) { Log.e(TAG, "TUN write: " + e.getMessage()); }
                          }
                      }
                      @Override public void onClose(int code, String reason, boolean remote) {
                          VpnModule.emitEvent("vpnDisconnected", reason); isRunning = false;
                      }
                      @Override public void onError(Exception ex) { VpnModule.emitEvent("vpnError", ex.getMessage()); }
                  };
                  wsClient.setSocketFactory(new SSLSocketFactory() {
                      private final SSLSocketFactory d = (SSLSocketFactory) SSLSocketFactory.getDefault();
                      @Override public Socket createSocket() throws IOException { Socket s = new Socket(); self.protect(s); return s; }
                      @Override public Socket createSocket(String h, int p) throws IOException { Socket s = d.createSocket(h, p); self.protect(s); return s; }
                      @Override public Socket createSocket(String h, int p, InetAddress la, int lp) throws IOException { Socket s = d.createSocket(h, p, la, lp); self.protect(s); return s; }
                      @Override public Socket createSocket(InetAddress h, int p) throws IOException { Socket s = d.createSocket(h, p); self.protect(s); return s; }
                      @Override public Socket createSocket(InetAddress a, int p, InetAddress la, int lp) throws IOException { Socket s = d.createSocket(a, p, la, lp); self.protect(s); return s; }
                      @Override public Socket createSocket(Socket s, String h, int p, boolean ac) throws IOException { Socket ns = d.createSocket(s, h, p, ac); self.protect(ns); return ns; }
                      @Override public String[] getDefaultCipherSuites() { return d.getDefaultCipherSuites(); }
                      @Override public String[] getSupportedCipherSuites() { return d.getSupportedCipherSuites(); }
                  });
                  wsClient.connectBlocking();
                  if ("client".equals(role)) startPacketReadLoop();
              }
              private void startPacketReadLoop() {
                  executor.execute(() -> {
                      byte[] packet = new byte[32767];
                      try (FileInputStream in = new FileInputStream(vpnInterface.getFileDescriptor())) {
                          while (isRunning) {
                              int len = in.read(packet);
                              if (len > 0 && wsClient != null && wsClient.isOpen())
                                  wsClient.send(ByteBuffer.wrap(packet, 0, len));
                          }
                      } catch (Exception e) { if (isRunning) Log.e(TAG, "Packet read: " + e.getMessage()); }
                  });
              }
              private void handleRelayMessage(String msg) {
                  try {
                      if (msg.contains("\"SESSION_CREATED\"")) VpnModule.emitEvent("sessionCreated", msg.split("\"code\":\"")[1].split("\"")[0]);
                      else if (msg.contains("\"JOIN_SUCCESS\"")) VpnModule.emitEvent("joinSuccess", sessionCode);
                      else if (msg.contains("\"JOIN_ERROR\"")) VpnModule.emitEvent("joinError", msg.split("\"reason\":\"")[1].split("\"")[0]);
                      else if (msg.contains("\"CLIENT_CONNECTED\"")) VpnModule.emitEvent("clientConnected", msg.split("\"clientId\":\"")[1].split("\"")[0]);
                      else if (msg.contains("\"CLIENT_DISCONNECTED\"")) VpnModule.emitEvent("clientDisconnected", "");
                      else if (msg.contains("\"HOST_LEFT\"")) VpnModule.emitEvent("hostLeft", "Host ended the session");
                      else if (msg.contains("\"PING\"") && wsClient != null && wsClient.isOpen()) wsClient.send("{\"type\":\"PONG\"}");
                  } catch (Exception e) { Log.e(TAG, "Parse: " + e.getMessage()); }
              }
              private void stopVpnTunnel() {
                  isRunning = false;
                  try { if (wsClient != null) { wsClient.send("host".equals(role) ? "{\"type\":\"HOST_LEAVE\"}" : "{\"type\":\"CLIENT_LEAVE\"}"); wsClient.close(); } } catch (Exception ignored) {}
                  try { if (vpnInterface != null) { vpnInterface.close(); vpnInterface = null; } } catch (Exception ignored) {}
                  if (executor != null) executor.shutdownNow();
                  VpnModule.emitEvent("vpnDisconnected", "User stopped sharing");
                  stopForeground(true);
                  stopSelf();
              }
              private void startForegroundNotification() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      getSystemService(NotificationManager.class).createNotificationChannel(
                          new NotificationChannel(CHANNEL_ID, "NetShare VPN", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent stop = PendingIntent.getService(this, 0,
                      new Intent(this, NetShareVpnService.class).setAction("STOP_VPN"), PendingIntent.FLAG_IMMUTABLE);
                  startForeground(NOTIFICATION_ID, new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("NetShare Active").setContentText("Sharing internet via relay...")
                      .setSmallIcon(android.R.drawable.ic_menu_share)
                      .addAction(android.R.drawable.ic_delete, "Stop", stop)
                      .setOngoing(true).build());
              }
              @Override public void onDestroy() { stopVpnTunnel(); super.onDestroy(); }
          }
          JAVAEOF

          echo "=== Java files written ==="
          ls -la $DEST/

      # ── Patch MainApplication.kt ─────────────────────────────
      - name: Patch MainApplication.kt
        run: |
          FILE=$(find $BUILD_DIR/android -name "MainApplication.kt" | head -1)
          echo "Found: $FILE"
          python3 - << PYEOF
          with open("$FILE", "r") as f:
              content = f.read()

          if "VpnPackage" not in content:
              content = content.replace(
                  "package com.netsharebuild\n",
                  "package com.netsharebuild\n\nimport com.netsharebuild.netshare.VpnPackage\n"
              )
              content = content.replace(
                  "PackageList(this).packages",
                  "PackageList(this).packages.also { it.add(VpnPackage()) }"
              )

          with open("$FILE", "w") as f:
              f.write(content)

          print("MainApplication.kt patched")
          for i, line in enumerate(content.splitlines()[:25], 1):
              print(f"{i}: {line}")
          PYEOF

      # ── Patch app/build.gradle safely with Python ────────────
      - name: Patch app build.gradle
        run: |
          GRADLE=$BUILD_DIR/android/app/build.gradle
          echo "=== ORIGINAL build.gradle ==="
          cat "$GRADLE"

          python3 - << PYEOF
          import re

          with open("$GRADLE", "r") as f:
              content = f.read()

          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 34', content)
          content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 34', content)
          content = re.sub(r'compileSdk\s+\d+', 'compileSdk 34', content)
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 34', content)
          content = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 34', content)
          content = re.sub(r'targetSdk\s+\d+', 'targetSdk 34', content)

          if "java-websocket" not in content:
              content = content.replace(
                  "dependencies {",
                  'dependencies {\n    implementation "org.java-websocket:Java-WebSocket:1.5.4"',
                  1
              )

          with open("$GRADLE", "w") as f:
              f.write(content)

          print("build.gradle patched")
          for line in content.splitlines():
              if any(k in line for k in ["compileSdk", "targetSdk", "java-websocket"]):
                  print("  >>", line.strip())
          PYEOF

      # ── Fix gradle.properties ────────────────────────────────
      - name: Fix gradle.properties
        run: |
          PROPS=$BUILD_DIR/android/gradle.properties
          python3 - << PYEOF
          with open("$PROPS", "r") as f:
              lines = f.readlines()

          result = []
          found_jvm = False
          found_androidx = False
          found_jetifier = False

          for line in lines:
              if line.startswith("org.gradle.jvmargs"):
                  result.append("org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m\n")
                  found_jvm = True
              elif line.startswith("android.useAndroidX"):
                  result.append("android.useAndroidX=true\n")
                  found_androidx = True
              elif line.startswith("android.enableJetifier"):
                  result.append("android.enableJetifier=true\n")
                  found_jetifier = True
              else:
                  result.append(line)

          if not found_jvm:
              result.append("org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m\n")
          if not found_androidx:
              result.append("android.useAndroidX=true\n")
          if not found_jetifier:
              result.append("android.enableJetifier=true\n")

          with open("$PROPS", "w") as f:
              f.writelines(result)

          print("gradle.properties fixed")
          PYEOF

      # ── Install Node dependencies ────────────────────────────
      - name: Install Node dependencies
        run: npm install
        working-directory: /home/runner/NetShareBuild

      # ── Cache Gradle ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Bundle JS into assets ────────────────────────────────
      # FIX: Debug APKs fetch JS from Metro at localhost:8081 at runtime.
      # Pre-bundling bakes the JS into the APK so it works on any device
      # without a dev machine or USB cable.
      - name: Bundle JS for Android
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
        working-directory: /home/runner/NetShareBuild

      # ── Build Release APK ────────────────────────────────────
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: /home/runner/NetShareBuild
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── Verify APK ───────────────────────────────────────────
      - name: Verify APK
        run: |
          APK=$(find $BUILD_DIR/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found!"
            find $BUILD_DIR/android/app/build -name "*.apk" 2>/dev/null || echo "No APK anywhere"
            exit 1
          fi
          echo "SUCCESS: $(du -h $APK)"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      # ── Upload APK artifact ──────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── Create GitHub Release ────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: NetShare v${{ github.run_number }}
          body: |
            ## NetShare APK - Build #${{ github.run_number }}
            1. Download **app-release-unsigned.apk** below
            2. Transfer to your Android phone
            3. Tap Install (enable Unknown sources if asked)
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
