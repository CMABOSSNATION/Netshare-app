name: Build NetShare APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: /home/runner/NetShareBuild
      # Must match the react-native version in package.json exactly
      RN_VERSION: '0.74.1'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-netshare-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-netshare-
            ${{ runner.os }}-gradle-

      # FIX 1: Init scaffold using the SAME RN version as package.json (0.74.1)
      # Mismatched versions cause dependency conflicts and Gradle failures.
      - name: Initialize React Native project
        run: |
          cd /home/runner
          npx --yes react-native@${{ env.RN_VERSION }} init NetShareBuild \
            --version ${{ env.RN_VERSION }} \
            --skip-install
        env:
          CI: false

      - name: Copy JS source files
        run: |
          # FIX 2: Remove the scaffold's default App.tsx so it doesn't conflict
          # with our App.jsx. Metro would otherwise find two entry components.
          rm -f "$BUILD_DIR/App.tsx"

          cp "$GITHUB_WORKSPACE/App.jsx"                    "$BUILD_DIR/App.jsx"
          cp "$GITHUB_WORKSPACE/index.js"                   "$BUILD_DIR/index.js"
          mkdir -p "$BUILD_DIR/src/screens" "$BUILD_DIR/src/services" "$BUILD_DIR/src/store"
          cp "$GITHUB_WORKSPACE/src/screens/HomeScreen.jsx" "$BUILD_DIR/src/screens/"
          cp "$GITHUB_WORKSPACE/src/services/VpnService.js" "$BUILD_DIR/src/services/"
          cp "$GITHUB_WORKSPACE/src/store/index.js"         "$BUILD_DIR/src/store/"
          echo "=== JS files copied ==="

      - name: Merge package.json
        run: |
          python3 << 'PYEOF'
          import json, os
          wp = os.environ["GITHUB_WORKSPACE"]
          bd = os.environ["BUILD_DIR"]
          repo     = json.load(open(wp + "/package.json"))
          scaffold = json.load(open(bd + "/package.json"))
          scaffold["dependencies"].update(repo.get("dependencies", {}))
          scaffold["devDependencies"].update(repo.get("devDependencies", {}))
          json.dump(scaffold, open(bd + "/package.json", "w"), indent=2)
          print("Merged package.json")
          PYEOF

      # FIX 3: Copy the repo's AndroidManifest.xml AS-IS — it already has the
      # correct <application>, <activity>, and <service> blocks.
      # The old workflow replaced it with a permissions-only stub, which meant
      # the APK had no Activity/Service and crashed immediately on launch.
      - name: Copy AndroidManifest
        run: |
          DEST="$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          cp "$GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml" "$DEST"
          echo "=== AndroidManifest copied ==="
          cat "$DEST"

      # FIX 4: Copy the REAL Java source files from the repo.
      # The old workflow wrote stub VpnModule/VpnPackage that lacked prepare(),
      # had wrong method signatures (no Promise param), and were missing
      # NetShareVpnService.java entirely.
      # We copy all three real files and put them in the correct package directory.
      - name: Copy native Java source files
        run: |
          # The scaffold generates package com.netsharebuild (matches init name NetShareBuild)
          # Our Java files use package com.netshare — we must fix the package declaration
          # to match the scaffold's applicationId, which we'll also align.
          JAVA_DEST="$BUILD_DIR/android/app/src/main/java/com/netsharebuild"
          mkdir -p "$JAVA_DEST"

          # Copy and rewrite package declaration in all three Java files
          for FILE in VpnModule.java VpnPackage.java NetShareVpnService.java; do
            SRC="$GITHUB_WORKSPACE/android/app/src/main/java/com/netshare/$FILE"
            sed 's/^package com\.netshare;/package com.netsharebuild;/' "$SRC" \
              > "$JAVA_DEST/$FILE"
            echo "Copied and repackaged: $FILE"
          done

          # Also fix cross-references inside each file (e.g. "import com.netshare.*")
          for FILE in "$JAVA_DEST"/*.java; do
            sed -i 's/com\.netshare\./com.netsharebuild./g' "$FILE"
            echo "Fixed cross-refs in: $(basename $FILE)"
          done

          echo "=== Java files ==="
          ls -la "$JAVA_DEST/"

      # FIX 5: Patch MainApplication.kt to register VpnPackage.
      # RN 0.74 Kotlin template uses getPackages() override, NOT PackageList(this).packages.
      # The old sed command targeted the wrong pattern and never matched.
      - name: Patch MainApplication.kt to register VpnPackage
        run: |
          FILE=$(find "$BUILD_DIR/android" -name "MainApplication.kt" | head -1)
          echo "Patching: $FILE"

          # Show the getPackages function so we can see the actual pattern
          grep -n "getPackages\|PackageList\|ReactPackage" "$FILE" || true

          # Add the import for VpnPackage after the package declaration line
          if ! grep -q "VpnPackage" "$FILE"; then
            # Insert import after the first 'import' line block
            sed -i '/^import com\.facebook\.react\.ReactApplication/a import com.netsharebuild.VpnPackage' "$FILE"

            # RN 0.74 template: getPackages() returns PackageList(this).packages
            # We append VpnPackage() to the returned list
            sed -i 's/return PackageList(this)\.packages/return PackageList(this).packages.also { it.add(VpnPackage()) }/' "$FILE"

            echo "VpnPackage registered in MainApplication.kt"
          else
            echo "VpnPackage already registered"
          fi

          echo "=== MainApplication.kt head ==="
          head -40 "$FILE"

      # FIX 6: Set the applicationId in build.gradle to com.netsharebuild
      # so it matches the Java package and the manifest's component references.
      - name: Patch app build.gradle
        run: |
          python3 << 'PYEOF'
          import re, os
          p = os.environ["BUILD_DIR"] + "/android/app/build.gradle"
          content = open(p).read()

          # Ensure applicationId matches our Java package
          if 'applicationId "com.netsharebuild"' not in content:
              content = re.sub(
                  r'applicationId\s+"[^"]+"',
                  'applicationId "com.netsharebuild"',
                  content
              )

          open(p, "w").write(content)
          print("app/build.gradle patched — applicationId = com.netsharebuild")
          # Show the android block
          for line in content.split('\n'):
              if 'applicationId' in line or 'compileSdk' in line or 'targetSdk' in line:
                  print(line)
          PYEOF

      - name: Fix gradle.properties
        run: |
          python3 << 'PYEOF'
          import os
          p = os.environ["BUILD_DIR"] + "/android/gradle.properties"
          lines = open(p).readlines()
          result, seen = [], set()
          for line in lines:
              key = line.split("=")[0].strip() if "=" in line else ""
              if key and key in seen:
                  continue
              if key:
                  seen.add(key)
              result.append(line)
          required = [
              "org.gradle.jvmargs=-Xmx2048m\n",
              "android.useAndroidX=true\n",
              "android.enableJetifier=true\n"
          ]
          for req in required:
              key = req.split("=")[0].strip()
              if not any(key in line for line in result):
                  result.append(req)
          open(p, "w").writelines(result)
          print("gradle.properties fixed")
          PYEOF

      - name: Install Node dependencies
        run: npm install
        working-directory: /home/runner/NetShareBuild

      - name: Copy vector icon fonts
        run: |
          FONTS_SRC="$BUILD_DIR/node_modules/react-native-vector-icons/Fonts"
          FONTS_DEST="$BUILD_DIR/android/app/src/main/assets/fonts"
          mkdir -p "$FONTS_DEST"
          if [ -d "$FONTS_SRC" ]; then
            cp "$FONTS_SRC"/*.ttf "$FONTS_DEST/"
            echo "Fonts copied"
          else
            echo "No fonts dir, skipping"
          fi

      - name: Bundle JS into Android assets
        run: |
          mkdir -p "$BUILD_DIR/android/app/src/main/assets"
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output "$BUILD_DIR/android/app/src/main/assets/index.android.bundle" \
            --reset-cache
        working-directory: /home/runner/NetShareBuild
        env:
          CI: false
          NODE_ENV: production

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: /home/runner/NetShareBuild
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify APK
        run: |
          APK="$BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            find "$BUILD_DIR/android/app/build" -name "*.apk" 2>/dev/null || echo "No APK anywhere"
            exit 1
          fi
          echo "SUCCESS: $(du -h $APK)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-debug-apk
          path: /home/runner/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: NetShare v${{ github.run_number }}
          body: |
            ## NetShare APK - Build #${{ github.run_number }}
            1. Download **app-debug.apk** below
            2. Transfer to your Android phone
            3. Tap Install (enable Unknown sources if asked)
            4. Works standalone - no development server needed
          files: /home/runner/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
