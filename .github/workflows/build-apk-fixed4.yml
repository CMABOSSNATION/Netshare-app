name: Build NetShare APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: /home/runner/NetShareBuild
      RN_VERSION: '0.74.1'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-netshare-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-netshare-
            ${{ runner.os }}-gradle-

      - name: Initialize React Native project
        run: |
          cd /home/runner
          npx --yes react-native@${{ env.RN_VERSION }} init NetShareBuild \
            --version ${{ env.RN_VERSION }} \
            --skip-install
        env:
          CI: false

      - name: Copy JS source files
        run: |
          rm -f "$BUILD_DIR/App.tsx"
          cp "$GITHUB_WORKSPACE/App.jsx"                    "$BUILD_DIR/App.jsx"
          cp "$GITHUB_WORKSPACE/index.js"                   "$BUILD_DIR/index.js"
          mkdir -p "$BUILD_DIR/src/screens" "$BUILD_DIR/src/services" "$BUILD_DIR/src/store"
          cp "$GITHUB_WORKSPACE/src/screens/HomeScreen.jsx" "$BUILD_DIR/src/screens/"
          cp "$GITHUB_WORKSPACE/src/services/VpnService.js" "$BUILD_DIR/src/services/"
          cp "$GITHUB_WORKSPACE/src/store/index.js"         "$BUILD_DIR/src/store/"
          echo "=== JS files copied ==="

      - name: Merge package.json (with compatible dependency pins)
        run: |
          python3 << 'PYEOF'
          import json, os
          wp = os.environ["GITHUB_WORKSPACE"]
          bd = os.environ["BUILD_DIR"]
          repo     = json.load(open(wp + "/package.json"))
          scaffold = json.load(open(bd + "/package.json"))
          repo_deps = repo.get("dependencies", {})
          repo_deps.pop("react", None)
          repo_deps.pop("react-native", None)
          scaffold["dependencies"].update(repo_deps)
          scaffold["devDependencies"].update(repo.get("devDependencies", {}))

          # Pin reanimated to 3.16.7 — last release compatible with RN 0.74 old arch.
          scaffold["dependencies"]["react-native-reanimated"] = "3.16.7"

          # FIX: Pin gesture-handler to 2.16.2 — last version that does NOT use
          # ViewManagerWithGeneratedInterface (introduced in 2.17+), which is
          # unavailable in RN 0.74 Paper / old architecture and causes a
          # Kotlin compile error: "Cannot access ViewManagerWithGeneratedInterface".
          scaffold["dependencies"]["react-native-gesture-handler"] = "2.16.2"

          json.dump(scaffold, open(bd + "/package.json", "w"), indent=2)
          print("Merged package.json — reanimated=3.16.7, gesture-handler=2.16.2")
          PYEOF

      - name: Copy AndroidManifest
        run: |
          cp "$GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml" \
             "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          echo "=== AndroidManifest copied ==="

      # FIX-ANDROID14-A: Patch AndroidManifest for Android 14 foreground service type.
      # Android 14 (API 34) enforces that any foreground service must declare
      # android:foregroundServiceType in the manifest. For a VpnService this must be
      # "connectedDevice". Without it, startForeground() throws
      # ForegroundServiceStartNotAllowedException at runtime on API 34+ devices,
      # silently crashing the VPN before it can connect.
      # We also ensure FOREGROUND_SERVICE permission is declared (required API 28+).
      - name: Patch AndroidManifest for Android 14 foreground service type
        run: |
          python3 << 'PYEOF'
          import re, os

          manifest_path = os.environ["BUILD_DIR"] + "/android/app/src/main/AndroidManifest.xml"
          content = open(manifest_path).read()

          # 1. Ensure FOREGROUND_SERVICE permission exists (required from API 28+)
          if 'android.permission.FOREGROUND_SERVICE"' not in content:
              content = content.replace(
                  '<uses-permission android:name="android.permission.INTERNET"',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.INTERNET"'
              )
              print("Added FOREGROUND_SERVICE permission")

          # 2. Ensure FOREGROUND_SERVICE_CONNECTED_DEVICE permission (API 34+)
          #    This is a new fine-grained permission needed alongside the type attribute.
          if 'FOREGROUND_SERVICE_CONNECTED_DEVICE' not in content:
              content = content.replace(
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"/>'
              )
              print("Added FOREGROUND_SERVICE_CONNECTED_DEVICE permission")

          # 3. Add foregroundServiceType="connectedDevice" to NetShareVpnService entry.
          #    VpnService counts as "connectedDevice" type (it routes network traffic).
          #    We patch any <service> tag containing NetShareVpnService.
          def add_fg_type(match):
              tag = match.group(0)
              if 'foregroundServiceType' not in tag:
                  # Insert before the closing > or />
                  tag = re.sub(r'(\s*/>|\s*>)$', 
                                ' android:foregroundServiceType="connectedDevice"\\1', tag)
                  print("Added foregroundServiceType=connectedDevice to NetShareVpnService")
              return tag

          content = re.sub(
              r'<service[^>]*NetShareVpnService[^>]*/?>',
              add_fg_type,
              content,
              flags=re.DOTALL
          )

          open(manifest_path, "w").write(content)
          print("AndroidManifest patched for Android 14 compatibility")
          print("--- Relevant manifest lines ---")
          for i, line in enumerate(open(manifest_path)):
              if any(k in line for k in ["FOREGROUND", "VpnService", "foregroundService"]):
                  print(f"  L{i+1}: {line.rstrip()}")
          PYEOF

      - name: Copy native Java source files
        run: |
          JAVA_DEST="$BUILD_DIR/android/app/src/main/java/com/netsharebuild"
          mkdir -p "$JAVA_DEST"
          for FILE in VpnModule.java VpnPackage.java NetShareVpnService.java; do
            SRC="$GITHUB_WORKSPACE/android/app/src/main/java/com/netshare/$FILE"
            sed 's/^package com\.netshare;/package com.netsharebuild;/' "$SRC" > "$JAVA_DEST/$FILE"
            sed -i 's/com\.netshare\./com.netsharebuild./g' "$JAVA_DEST/$FILE"
            echo "Copied: $FILE"
          done
          ls -la "$JAVA_DEST/"

      - name: Patch MainApplication.kt to register VpnPackage
        run: |
          FILE=$(find "$BUILD_DIR/android" -name "MainApplication.kt" | head -1)
          echo "=== Patching: $FILE ==="
          if ! grep -q "VpnPackage" "$FILE"; then
            python3 << 'PYEOF'
          import re, os, glob

          build_dir = os.environ["BUILD_DIR"]
          matches = glob.glob(build_dir + "/android/**/MainApplication.kt", recursive=True)
          if not matches:
              print("ERROR: MainApplication.kt not found!")
              exit(1)
          f = matches[0]
          print("Found: " + f)
          content = open(f).read()

          if "import com.netsharebuild.VpnPackage" not in content:
              content = re.sub(
                  r'(import com\.facebook\.react\.ReactApplication)',
                  'import com.netsharebuild.VpnPackage\n\\1',
                  content
              )

          if "VpnPackage()" not in content:
              content = re.sub(
                  r'(PackageList\(this\)\.packages\.apply\s*\{)',
                  r'\1\n              add(VpnPackage())',
                  content
              )

          if "VpnPackage()" not in content:
              content = re.sub(
                  r'(return\s+mutableListOf\s*\()',
                  r'return mutableListOf(\n              VpnPackage(),',
                  content
              )

          open(f, "w").write(content)
          print("VpnPackage successfully registered")
          PYEOF
          else
            echo "VpnPackage already present, skipping"
          fi
          echo "=== Verification ==="
          grep -n "VpnPackage\|PackageList\|getPackages" "$FILE" || true

      # FIX-ANDROID14-B + FIX-ANDROID8-A: Patch app/build.gradle for full API range.
      #
      # Android 14 fixes applied here:
      #   - targetSdkVersion explicitly set to 34 (Android 14 refuses to install apps
      #     targeting < 34 starting with Play Store enforcement, and some OEM launchers
      #     block sideloaded APKs with targetSdk < 28 on Android 14 devices)
      #   - namespace "com.netsharebuild" added (AGP 8.2+ REQUIRES this — without it
      #     the build fails with "Namespace not specified" even if applicationId is set)
      #
      # Android 8 (API 26) fixes applied here:
      #   - minSdkVersion explicitly set to 23 (API 23 = Android 6, the lowest RN 0.74
      #     supports; this ensures Android 8 / API 26 is well within the supported range)
      #   - coreLibraryDesugaringEnabled true + desugar_jdk_libs:2.0.4 added
      #     java-websocket 1.5.4 internally uses java.util.concurrent and other APIs
      #     that on API 26 require D8 desugaring to backport. Without this, the app
      #     throws NoSuchMethodError or VerifyError on Android 8 at startup.
      #   - multiDexEnabled true added (java-websocket + RN together can exceed the
      #     65536 method limit on older DEX formats used by API 26 devices)
      - name: Patch app build.gradle (Android 14 + Android 8 compatibility)
        run: |
          python3 << 'PYEOF'
          import re, os

          bd = os.environ["BUILD_DIR"]
          p  = bd + "/android/app/build.gradle"
          content = open(p).read()

          # ── applicationId ────────────────────────────────────────────
          content = re.sub(
              r'applicationId\s+"[^"]+"',
              'applicationId "com.netsharebuild"',
              content)

          # ── FIX-ANDROID14-B: namespace (required by AGP 8.2+) ────────
          # AGP 8.2 made namespace mandatory. Without it the build errors:
          # "Namespace not specified. Please specify a namespace for the
          #  generated R and BuildConfig classes."
          if 'namespace' not in content:
              content = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    namespace "com.netsharebuild"',
                  content,
                  count=1
              )
              print("Added namespace = com.netsharebuild")
          else:
              content = re.sub(
                  r'namespace\s+"[^"]+"',
                  'namespace "com.netsharebuild"',
                  content)
              print("Updated existing namespace")

          # ── compileSdk ───────────────────────────────────────────────
          content = re.sub(
              r'compileSdkVersion\s*=?\s*(?:rootProject\.ext\.compileSdkVersion|\d+)',
              'compileSdkVersion 35', content)
          content = re.sub(
              r'compileSdk\s*=?\s*(?:rootProject\.ext\.compileSdkVersion|\d+)',
              'compileSdk = 35', content)

          # ── FIX-ANDROID14-B: targetSdkVersion = 34 ───────────────────
          # Android 14 devices will refuse or warn on apps targeting < 34.
          # We set 34 (not 35) because targetSdk 35 requires additional
          # edge-to-edge + predictive back gesture handling we haven't added.
          if re.search(r'targetSdkVersion\s*=?\s*\d+', content):
              content = re.sub(
                  r'targetSdkVersion\s*=?\s*\d+',
                  'targetSdkVersion 34',
                  content)
          elif re.search(r'targetSdk\s*=\s*\d+', content):
              content = re.sub(
                  r'targetSdk\s*=\s*\d+',
                  'targetSdk = 34',
                  content)
          else:
              # Not found — inject it next to compileSdk
              content = re.sub(
                  r'(compileSdk\s*=\s*35)',
                  r'\1\n        targetSdk = 34',
                  content)
          print("targetSdkVersion set to 34 (Android 14)")

          # ── FIX-ANDROID8-A: minSdkVersion = 23 ───────────────────────
          # Explicitly pin minSdk=23. RN 0.74 scaffold should already do this,
          # but we ensure it is never accidentally lowered by other patch steps.
          # API 23 (Android 6) is the lowest RN 0.74 supports and covers
          # Android 8 (API 26) comfortably.
          if re.search(r'minSdkVersion\s*=?\s*\d+', content):
              content = re.sub(
                  r'minSdkVersion\s*=?\s*\d+',
                  'minSdkVersion 23',
                  content)
          elif re.search(r'minSdk\s*=\s*\d+', content):
              content = re.sub(
                  r'minSdk\s*=\s*\d+',
                  'minSdk = 23',
                  content)
          else:
              content = re.sub(
                  r'(targetSdk\s*=\s*34)',
                  r'\1\n        minSdk = 23',
                  content)
          print("minSdkVersion set to 23 (Android 6+, covers Android 8)")

          # ── FIX-ANDROID8-A: multiDexEnabled ──────────────────────────
          # java-websocket + RN can exceed the 65536-method DEX limit on
          # older toolchains. multiDex prevents "Cannot fit requested classes
          # in a single dex file" build error.
          if 'multiDexEnabled' not in content:
              content = re.sub(
                  r'(targetSdkVersion\s*\d+|targetSdk\s*=\s*\d+)',
                  r'\1\n        multiDexEnabled true',
                  content,
                  count=1)
              print("Added multiDexEnabled true")

          # ── java-websocket dependency ────────────────────────────────
          if 'java-websocket' not in content:
              content = re.sub(
                  r'(dependencies\s*\{)',
                  r'\1\n    implementation "org.java-websocket:Java-WebSocket:1.5.4"',
                  content)
              print("Added java-websocket dependency")

          # ── FIX-ANDROID8-A: Core library desugaring ──────────────────
          # java-websocket 1.5.4 uses java.util.function and other APIs
          # that do not exist on Android 8 (API 26) without D8 desugaring.
          # desugar_jdk_libs backports these APIs to older Android versions.
          # Without this: NoSuchMethodError / VerifyError crash on API 26 at launch.
          if 'coreLibraryDesugaringEnabled' not in content:
              # Enable in compileOptions block
              if 'compileOptions' in content:
                  content = re.sub(
                      r'(compileOptions\s*\{[^}]*)(})',
                      r'\1    coreLibraryDesugaringEnabled true\n    \2',
                      content,
                      flags=re.DOTALL)
              else:
                  # Inject compileOptions block if missing
                  content = re.sub(
                      r'(android\s*\{)',
                      r'\1\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }',
                      content,
                      count=1)
              print("Enabled coreLibraryDesugaringEnabled")

          # Add desugar_jdk_libs dependency
          if 'desugar_jdk_libs' not in content:
              content = re.sub(
                  r'(dependencies\s*\{)',
                  r'\1\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"',
                  content)
              print("Added desugar_jdk_libs:2.0.4 dependency")

          # ── multidex dependency ──────────────────────────────────────
          if 'multidex' not in content:
              content = re.sub(
                  r'(dependencies\s*\{)',
                  r'\1\n    implementation "androidx.multidex:multidex:2.0.1"',
                  content)
              print("Added multidex dependency")

          open(p, "w").write(content)
          print("\napp/build.gradle final relevant lines:")
          for line in open(p):
              if any(k in line for k in ['compileSdk','targetSdk','minSdk','namespace',
                                          'applicationId','java-websocket','desugar',
                                          'multidex','multiDex','coreLibrary']):
                  print("  " + line.rstrip())
          PYEOF

      - name: Patch root build.gradle (resolutionStrategy + AGP compat)
        run: |
          python3 << 'PYEOF'
          import re, os

          bd = os.environ["BUILD_DIR"]
          rp = bd + "/android/build.gradle"
          root = open(rp).read()

          root = re.sub(r'(compileSdkVersion\s*=\s*)\d+', r'\g<1>35', root)
          root = re.sub(r'(ext\.compileSdkVersion\s*=\s*)\d+', r'\g<1>35', root)

          if 'resolutionStrategy' not in root:
              force_block = (
                  "\nallprojects {\n"
                  "    configurations.all {\n"
                  "        resolutionStrategy {\n"
                  "            force 'androidx.core:core:1.15.0'\n"
                  "            force 'androidx.core:core-ktx:1.15.0'\n"
                  # FIX-ANDROID8-A: Force multidex version consistent with our dep
                  "            force 'androidx.multidex:multidex:2.0.1'\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
              root = root + force_block
              print("ROOT build.gradle patched — resolutionStrategy added")
          else:
              # Already has resolutionStrategy — ensure multidex force is present
              if 'multidex' not in root:
                  root = re.sub(
                      r"(force 'androidx\.core:core-ktx:[^']*')",
                      r"\1\n            force 'androidx.multidex:multidex:2.0.1'",
                      root)
                  print("ROOT build.gradle — added multidex force to existing resolutionStrategy")
              else:
                  print("ROOT build.gradle already has resolutionStrategy, skipping")

          open(rp, "w").write(root)
          PYEOF

      - name: Fix gradle.properties
        run: |
          python3 << 'PYEOF'
          import os
          p = os.environ["BUILD_DIR"] + "/android/gradle.properties"
          lines = open(p).readlines()
          result, seen = [], set()
          for line in lines:
              key = line.split("=")[0].strip() if "=" in line else ""
              if key and key in seen:
                  continue
              if key:
                  seen.add(key)
              result.append(line)
          required = {
              "org.gradle.jvmargs": "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m\n",
              "android.useAndroidX": "android.useAndroidX=true\n",
              "android.enableJetifier": "android.enableJetifier=true\n",
              "org.gradle.daemon": "org.gradle.daemon=false\n",
              # Suppress the compileSdk=35 warning from AGP 8.2
              "android.suppressUnsupportedCompileSdk": "android.suppressUnsupportedCompileSdk=35\n",
          }
          for key, line in required.items():
              if not any(key in l for l in result):
                  result.append(line)
          open(p, "w").writelines(result)
          print("gradle.properties fixed")
          PYEOF

      - name: Install Node dependencies
        run: npm install
        working-directory: /home/runner/NetShareBuild

      - name: Copy vector icon fonts
        run: |
          FONTS_SRC="$BUILD_DIR/node_modules/react-native-vector-icons/Fonts"
          FONTS_DEST="$BUILD_DIR/android/app/src/main/assets/fonts"
          mkdir -p "$FONTS_DEST"
          if [ -d "$FONTS_SRC" ]; then
            cp "$FONTS_SRC"/*.ttf "$FONTS_DEST/"
            echo "Fonts copied"
          else
            echo "No fonts dir, skipping"
          fi

      - name: Bundle JS into Android assets
        run: |
          mkdir -p "$BUILD_DIR/android/app/src/main/assets"
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output "$BUILD_DIR/android/app/src/main/assets/index.android.bundle" \
            --reset-cache
        working-directory: /home/runner/NetShareBuild
        env:
          CI: false
          NODE_ENV: production

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: /home/runner/NetShareBuild
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify APK
        run: |
          APK="$BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            find "$BUILD_DIR/android/app/build" -name "*.apk" 2>/dev/null || echo "No APK anywhere"
            exit 1
          fi
          echo "SUCCESS: $(du -h $APK)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-debug-apk
          path: /home/runner/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: NetShare v${{ github.run_number }}
          body: |
            ## NetShare APK - Build #${{ github.run_number }}
            1. Download **app-debug.apk** below
            2. Transfer to your Android phone
            3. Tap Install (enable Unknown sources if asked)
            4. Works standalone - no development server needed
          files: /home/runner/NetShareBuild/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
